# Results manifest (Phase 5 R2-3): what docs/RESULTS.md shows, and from which runs.
#
# `ragforge-eval2 results --write` renders each [[table]] into the matching
# `<!-- generated:<id> ... -->` block of docs/RESULTS.md; `--check` re-renders and fails on any
# difference. Run ids are explicit: the exporter never picks "the latest" run, and a listed run
# whose summary is missing fails the export. Run ids and arm names are public (R3-2).
#
# provider/model: what produced the runs. When a run header records the model, it must match
# `model` (and `verifier_model`, when set); `models_from = "retrieval"` checks `model` against the
# header's "<embed_model>, <rerank_model>" instead. When the header records none (interview runs,
# and the demo retrieval run), the caption says "model from the manifest". Demo values come from evals/demo/arm.toml.
#
# Each metric: `name` (from the run's summary), `label` (the row text), `format` (ratio |
# seconds | number; default ratio). `pending = true` marks a row no run backs yet.

schema_version = 1

# ------------------------------------------------------------------ Acme demo (public)
[[table]]
id = "demo-retrieval"
dataset = "demo"
title = "Retrieval, Acme demo set"
provider = "Ollama embeddings, FlashRank reranker (in process)"
model = "nomic-embed-text, ms-marco-TinyBERT-L-2-v2"
models_from = "retrieval"
run_ids = ["retrieval-demo-20261021T173653Z"]
metrics = [
  { name = "retrieval.keyword.hit@5", label = "hit@5, keyword" },
  { name = "retrieval.vector.hit@5", label = "hit@5, vector" },
  { name = "retrieval.fused.hit@5", label = "hit@5, fused" },
  { name = "retrieval.reranked.hit@5", label = "hit@5, reranked" },
  { name = "retrieval.reranked.hit@10", label = "hit@10, reranked" },
  { name = "retrieval.keyword.mrr", label = "MRR, keyword" },
  { name = "retrieval.vector.mrr", label = "MRR, vector" },
  { name = "retrieval.fused.mrr", label = "MRR, fused" },
  { name = "retrieval.reranked.mrr", label = "MRR, reranked" },
  { name = "retrieval.fused.ndcg@10", label = "nDCG@10, fused" },
  { name = "retrieval.reranked.ndcg@10", label = "nDCG@10, reranked" },
  { name = "retrieval.reranked.recall@5", label = "recall@5, reranked (need=all questions)" },
  { name = "retrieval.reranked.recall@10", label = "recall@10, reranked (need=all questions)" },
  { name = "retrieval.fused.recall@20", label = "recall@20, fused (the reranker's ceiling)" },
  { name = "retrieval.unanswerable.below_tau", label = "unanswerable: top score below tau" },
