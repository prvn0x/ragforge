# OBS-STACK compose snippet (ADR-0018 revision 2, R2-7). The integrator merges `services` into
# compose.yaml's services and `volumes` into its volumes (shared default network, so Prometheus
# reaches api:9101 and the worker replicas by DNS). Kept as a standalone file so the OBS-STACK
# tests parse it, and `docker compose -f compose.yaml -f <this> --profile obs config` validates
# the merge without touching the live stack. Paths are relative to compose.yaml (the project
# directory).
services:
  # -------------------------------------------------------------- profile: obs
  prometheus:
    profiles: [obs]
    # v3.15.0 (2026-09-25). Index digest checked against the registry on 2026-10-22 with
    # `docker buildx imagetools inspect` (linux/arm64 + amd64). The OBS-STACK promtool tests run
    # this exact image, so the rules are tested on the binary that evaluates them.
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    # The full command line, so nothing is inherited: NO --web.enable-admin-api and NO
    # --web.enable-lifecycle (no TSDB delete/snapshot, no remote shutdown or reload).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=512MB
      - --web.listen-address=:9090
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # NO `ports:` entry: Prometheus is reachable only on the compose network (Grafana's proxy).
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  grafana:
    profiles: [obs]
    # 13.2.3 (2026-09-29). Index digest checked against the registry on 2026-10-22 with
    # `docker buildx imagetools inspect` (linux/arm64 + amd64).
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      # Admin password: generated by scripts/bootstrap.sh like the DB passwords. Grafana applies
      # it only when it first creates its database (grafana-data volume): rotating it later is
      # `docker compose exec grafana grafana cli admin reset-admin-password` (hidden input).
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${RAGFORGE_GRAFANA_ADMIN_PASSWORD:?run make env}
      # Served on localhost only; enforce_domain redirects any other Host header (DNS rebinding).
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: http://localhost:3000/
      GF_SERVER_ENFORCE_DOMAIN: "true"
      # No phone-home: nothing leaves the machine (ADR-0018: alert delivery is Grafana's UI only).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      # The plugin signing-key sync is a background service, NOT covered by any analytics flag:
      # it GETs <grafana_com.api_url>/plugins/ci/keys and repeats every 10 days. The bundled key
      # still verifies the core plugins. Preinstall is empty today; pinned off so a later
      # default cannot start downloading plugins.
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Fail closed: any grafana.com call left (or added by an upgrade) hits the discard port on
      # the container's own loopback and is refused at once, instead of leaving the machine.
      GF_GRAFANA_COM_URL: http://127.0.0.1:9
      GF_GRAFANA_COM_API_URL: http://127.0.0.1:9/api
      GF_GRAFANA_NET_URL: http://127.0.0.1:9
      # Grafana's own /metrics is served BEFORE auth; nothing scrapes it, so do not serve it.
      GF_METRICS_ENABLED: "false"
      # One local admin: no anonymous viewers, no self sign-up, no extra orgs, no plugin installs.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      # The root filesystem is read-only, so no log file under /var/log/grafana: stdout only
      # (make logs SERVICE=grafana).
      GF_LOG_MODE: console
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]  # the ONLY obs port on the host, loopback only
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m  # measured live: ~190 MiB idle, ~280-330 MiB in the first minutes after start
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
