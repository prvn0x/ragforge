[project]
name = "ragforge-client"
version = "0.1.0"
description = "Typed async SDK for the RAGForge API (depends only on contracts)"
requires-python = ">=3.12,<3.13"
dependencies = ["ragforge-contracts", "httpx>=0.27"]

[project.scripts]
ragforge-ask = "ragforge_client.ask:run"
ragforge-eval = "ragforge_client.evalrun:run"
ragforge-eval2 = "ragforge_client.evals.cli:run"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragforge_client"]
