[project]
name = "ragforge-contracts"
version = "0.1.0"
description = "RAGForge public API schemas and SSE event types (pydantic only)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragforge_contracts"]
