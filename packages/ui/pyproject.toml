[project]
name = "ragforge-ui"
version = "0.1.0"
description = "RAGForge Streamlit UI: a thin client of the public API. Built in Phase 3."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ragforge-client",
    "ragforge-contracts",
    # st.badge, chat_input(submit_mode=...) and st.context.headers: the tested version
    "streamlit>=1.66,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragforge_ui"]
