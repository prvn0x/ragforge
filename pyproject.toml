[project]
name = "ragforge-workspace"
version = "0.1.0"
description = "RAGForge workspace root (not published)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ragforge-contracts",
    "ragforge-core",
    "ragforge-client",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "hypothesis>=6.112",
    "respx>=0.21",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "psycopg[binary]>=3.2",
    "markdown-it-py>=4.2",  # module E1 sanitizer oracle
    "linkify-it-py>=2",  # E1 oracle: linkify with fuzzy_link=False (handoff E1, request 2)
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ragforge-contracts = { workspace = true }
ragforge-core = { workspace = true }
ragforge-client = { workspace = true }
ragforge-mcp = { workspace = true }
ragforge-ui = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
allowed-confusables = ["›"]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "TID"]
ignore = ["S101"]  # assert is fine in tests and invariants

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S608"]
"**/migrations/versions/**" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "packages/contracts/src:packages/core/src:packages/client/src:packages/mcp/src:packages/ui/src:packages/core/tests"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "pgvector.*", "alembic.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["packages"]
timeout = 300
# ADR-0018 R2-8: unit tests may only reach loopback; LangSmith pinned off (egress_guard.py).
addopts = ["-p", "egress_guard"]
pythonpath = ["packages/core/tests"]
markers = [
    "integration: needs Docker (testcontainers Postgres)",
]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
include_external_packages = true
root_packages = ["ragforge_contracts", "ragforge_core", "ragforge_client", "ragforge_mcp", "ragforge_ui"]

[[tool.importlinter.contracts]]
name = "Clients never import the server core (they cannot reach the DB)"
type = "forbidden"
source_modules = ["ragforge_client", "ragforge_mcp", "ragforge_ui"]
forbidden_modules = ["ragforge_core"]

[[tool.importlinter.contracts]]
name = "Contracts depend on nothing internal"
type = "forbidden"
source_modules = ["ragforge_contracts"]
forbidden_modules = ["ragforge_core", "ragforge_client", "ragforge_mcp", "ragforge_ui"]

[[tool.importlinter.contracts]]
name = "Core layering"
type = "layers"
layers = [
    "ragforge_core.apps",
    "ragforge_core.bootstrap",
    "ragforge_core.agent",
    "ragforge_core.services | ragforge_core.rag",
    "ragforge_core.domain",
]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "Adapters depend only on domain (plus config/db/observability infrastructure)"
type = "forbidden"
source_modules = ["ragforge_core.adapters"]
forbidden_modules = [
    "ragforge_core.services",
    "ragforge_core.rag",
    "ragforge_core.agent",
    "ragforge_core.apps",
    "ragforge_core.bootstrap",
]

[[tool.importlinter.contracts]]
name = "Business logic reaches adapters only through ports (bootstrap wires them)"
type = "forbidden"
source_modules = ["ragforge_core.services", "ragforge_core.rag", "ragforge_core.agent"]
forbidden_modules = ["ragforge_core.adapters", "ragforge_core.db", "sqlalchemy", "psycopg"]

[[tool.importlinter.contracts]]
name = "Domain is pure (no infrastructure imports)"
type = "forbidden"
source_modules = ["ragforge_core.domain"]
forbidden_modules = [
    "ragforge_core.adapters",
    "ragforge_core.db",
    "ragforge_core.services",
    "ragforge_core.rag",
    "ragforge_core.agent",
    "ragforge_core.apps",
    "sqlalchemy",
    "psycopg",
    "fastapi",
    "httpx",
]
